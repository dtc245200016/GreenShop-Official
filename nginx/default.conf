server_tokens off;

# Closed route classes: no IP, URI, args, identity, cookies or user agent.
map $uri $gs_route {
    default other;
    / home;
    ~^/Account(?:/|$) authentication;
    ~^/Admin(?:/|$) admin;
    ~^/SanPham(?:/|$) catalog;
    ~^/GioHang(?:/|$) cart;
    ~^/ThanhToan(?:/|$) orders;
    ~^/(?:supportHub|TroLy)(?:/|$) support;
    ~^/health(?:/|$) health;
    ~^/metrics(?:/|$) metrics;
    ~^/(?:css|js|lib|images|uploads)(?:/|$) static;
}
log_format greenshop_safe escape=json '{"timestamp_utc":"$time_iso8601",'
    '"method":"$request_method","status":"$status","duration":"$request_time",'
    '"route_group":"$gs_route","upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time"}';
access_log /dev/stdout greenshop_safe;

upstream greenshop_backend {
    zone greenshop_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server web_app:8080 resolve;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 6m;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Public requests must never reach telemetry, even with a forged token.
    location ^~ /metrics { return 404; }
    location ^~ /nginx_status { return 404; }

    location / {
        proxy_pass http://greenshop_backend;
        proxy_hide_header X-Frame-Options;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

# No published port. Only the exporter on the Docker network uses this listener.
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /nginx_status { stub_status; }
    location / { return 404; }
}
