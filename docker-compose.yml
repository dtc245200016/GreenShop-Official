services:
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: greenshop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: greenshop
      MYSQL_USER: greenshop_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
    ports:
    - 127.0.0.1:3306:3306
    volumes:
    - mysql_data:/var/lib/mysql
    networks:
    - app_net
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -uroot
        --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent >/dev/null
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
  phpmyadmin:
    image: phpmyadmin/phpmyadmin@sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    container_name: greenshop_phpmyadmin
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
    - 127.0.0.1:8080:80
    networks:
    - app_net
    healthcheck:
      test:
      - CMD
      - php
      - -r
      - '$$s=@fsockopen("127.0.0.1",80,$$errno,$$error,2); if(!$$s)exit(1); fwrite($$s,"GET
        / HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n"); stream_set_timeout($$s,2);
        $$line=fgets($$s); fclose($$s); exit(strpos($$line ?: ""," 200 ") === false
        ? 1 : 0);'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  web_app:
    build:
      context: ./backend
      dockerfile: GreenShop.Web/Dockerfile
      target: final
    container_name: greenshop_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_URLS=http://+:8080
    - AiChat__Enabled=${AI_CHAT_ENABLED:-false}
    - AiChat__FreeTierVerified=${AI_CHAT_FREE_TIER_VERIFIED:-false}
    - AiChat__FreeTierVerifiedModel=${AI_CHAT_FREE_TIER_VERIFIED_MODEL:-}
    - AiChat__FreeTierVerifiedUntil=${AI_CHAT_FREE_TIER_VERIFIED_UNTIL:-}
    - AiChat__RequestsPerDay=${AI_CHAT_REQUESTS_PER_DAY:-20}
    - AiChat__TokensPerMinute=${AI_CHAT_TOKENS_PER_MINUTE:-30000}
    - AiChat__TokensPerDay=${AI_CHAT_TOKENS_PER_DAY:-100000}
    - AiChat__MaxInputTokens=${AI_CHAT_MAX_INPUT_TOKENS:-12000}
    - AiChat__Provider=${AI_CHAT_PROVIDER:-Gemini}
    - AiChat__Model=${AI_CHAT_MODEL:-}
    - AiChat__ApiKey=${AI_CHAT_API_KEY:-}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - AiChat__TimeoutSeconds=${AI_CHAT_TIMEOUT_SECONDS:-20}
    - AiChat__RequestsPerMinute=${AI_CHAT_REQUESTS_PER_MINUTE:-5}
    - AiChat__MaxOutputTokens=${AI_CHAT_MAX_OUTPUT_TOKENS:-500}
    - AiChat__HistoryTurns=${AI_CHAT_HISTORY_TURNS:-4}
    - ConnectionStrings__DefaultConnection=Server=db;Database=greenshop;Uid=greenshop_app;Pwd=${MYSQL_APP_PASSWORD:?Set
      MYSQL_APP_PASSWORD in .env};
    - Metrics__TokenFile=/run/secrets/metrics_token
    volumes:
    - data_protection_keys:/app/keys
    - product_images:/app/wwwroot/uploads/products
    ports:
    - 127.0.0.1:5000:8080
    networks:
    - app_net
    - monitoring_net
    healthcheck:
      test:
      - CMD
      - dotnet
      - GreenShop.Web.dll
      - --healthcheck
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    secrets:
    - metrics_token
  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: nginx_server
    restart: always
    depends_on:
      web_app:
        condition: service_healthy
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
    - app_net
    - monitoring_net
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null --no-check-certificate https://127.0.0.1/health/ready
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  prometheus:
    restart: unless-stopped
    profiles:
    - monitoring
    networks:
    - monitoring_net
    - admin_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: prom/prometheus:v3.15.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=3d
    - --storage.tsdb.retention.size=512MB
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    secrets:
    - metrics_token
    ports:
    - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 3s
      retries: 12
  grafana:
    restart: unless-stopped
    profiles:
    - monitoring
    networks:
    - monitoring_net
    - admin_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_COOKIE_SECURE: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000/}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_UNIFIED_ALERTING_MIN_INTERVAL: 10s
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ALERTING_ENABLED: 'false'
      QA_WEBHOOK_URL: ${QA_WEBHOOK_URL:-http://qa-alert-receiver:8080/alerts}
    secrets:
    - grafana_password
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
    - 127.0.0.1:${GRAFANA_PORT:-3000}:3000
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 18
  mysql-exporter:
    restart: unless-stopped
    profiles:
    - monitoring
    networks:
    - app_net
    - monitoring_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: prom/mysqld-exporter:v0.20.0
    command:
    - --config.my-cnf=/run/secrets/mysql_exporter_config
    - --mysqld.address=db:3306
    - --no-collect.slave_status
    - --no-collect.info_schema.innodb_cmp
    - --no-collect.info_schema.innodb_cmpmem
    secrets:
    - mysql_exporter_config
    mem_limit: 64m
    cpus: 0.15
  nginx-exporter:
    restart: unless-stopped
    profiles:
    - monitoring
    networks:
    - monitoring_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: nginx/nginx-prometheus-exporter:1.5.3
    command:
    - --nginx.scrape-uri=http://nginx:8081/nginx_status
    mem_limit: 48m
    cpus: 0.15
  cadvisor:
    restart: unless-stopped
    profiles:
    - monitoring
    networks:
    - monitoring_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ghcr.io/google/cadvisor:0.60.6
    command:
    - --docker_only=true
    - --housekeeping_interval=10s
    - --store_container_labels=false
    - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    - --disable_metrics=disk,diskIO,percpu,referenced_memory,resctrl,sched,tcp,udp,hugetlb
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 256m
    cpus: 0.5
  qa-alert-receiver:
    restart: unless-stopped
    profiles:
    - qa
    networks:
    - monitoring_net
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: python:3.12.10-alpine3.21
    user: 65534:65534
    command:
    - python
    - /receiver.py
    volumes:
    - ./tests/monitoring/receiver.py:/receiver.py:ro
    tmpfs:
    - /tmp:size=16m,mode=1777
    read_only: true
    mem_limit: 32m
    cpus: 0.1
volumes:
  mysql_data: null
  data_protection_keys: null
  product_images: null
  prometheus_data: {}
  grafana_data: {}
networks:
  app_net:
    driver: bridge
  monitoring_net:
    driver: bridge
    internal: true
  admin_net:
    driver: bridge
secrets:
  metrics_token:
    file: ${MONITORING_SECRETS_DIR:?Set a private absolute MONITORING_SECRETS_DIR}/metrics-token
  grafana_password:
    file: ${MONITORING_SECRETS_DIR:?Set a private absolute MONITORING_SECRETS_DIR}/grafana-password
  mysql_exporter_config:
    file: ${MONITORING_SECRETS_DIR:?Set a private absolute MONITORING_SECRETS_DIR}/mysql-exporter.cnf
