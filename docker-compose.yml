# Main project: preserve this name and the existing external networks/volumes.
name: dtc245200016_btl_tkqt_htpm

services:
  db:
    image: sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: greenshop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: greenshop
      MYSQL_USER: greenshop_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
    ports: ['127.0.0.1:3306:3306']
    volumes:
    - mysql_data:/var/lib/mysql
    networks: [database_net, db_admin_net]
    healthcheck: {test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -uroot --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" --silent >/dev/null'], interval: 5s, timeout: 3s, retries: 12, start_period: 30s}
    logging: {driver: syslog, options: {syslog-address: 'udp://127.0.0.1:1514', syslog-format: rfc5424micro, tag: mysql, mode: non-blocking,
        max-buffer-size: 4m, cache-max-size: 10m, cache-max-file: '3'}}
    depends_on: {promtail: {condition: service_healthy}}

  phpmyadmin:
    image: sha256:42a200db07b4e70fbf32c594ad4521cf16399b8e54bbb5adceae98e7566dfbeb
    container_name: greenshop_phpmyadmin
    restart: always
    depends_on: {db: {condition: service_healthy}}
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports: ['127.0.0.1:8080:80']
    networks: [database_net, admin_net]
    healthcheck: {test: [CMD, php, -r, '$$s=@fsockopen("127.0.0.1",80,$$errno,$$error,2); if(!$$s)exit(1); fwrite($$s,"GET
          / HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n"); stream_set_timeout($$s,2); $$line=fgets($$s); fclose($$s);
          exit(strpos($$line ?: ""," 200 ") === false ? 1 : 0);'], interval: 10s, timeout: 5s, retries: 6, start_period: 15s}
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}

  web_app:
    build: {context: ./backend, dockerfile: GreenShop.Web/Dockerfile, target: final}
    container_name: greenshop_web
    restart: always
    depends_on: {db: {condition: service_healthy}, promtail: {condition: service_healthy}}
    environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_URLS=http://+:8080
    - AiChat__Enabled=${AI_CHAT_ENABLED:-false}
    - AiChat__RequestsPerDay=${AI_CHAT_REQUESTS_PER_DAY:-20}
    - AiChat__TokensPerMinute=${AI_CHAT_TOKENS_PER_MINUTE:-30000}
    - AiChat__TokensPerDay=${AI_CHAT_TOKENS_PER_DAY:-100000}
    - AiChat__MaxInputTokens=${AI_CHAT_MAX_INPUT_TOKENS:-12000}
    - AiChat__Provider=${AI_CHAT_PROVIDER:-Gemini}
    - AiChat__Model=${AI_CHAT_MODEL:-}
    - AiChat__ApiKey=${AI_CHAT_API_KEY:-}
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - AiChat__TimeoutSeconds=${AI_CHAT_TIMEOUT_SECONDS:-20}
    - AiChat__RequestsPerMinute=${AI_CHAT_REQUESTS_PER_MINUTE:-5}
    - AiChat__MaxOutputTokens=${AI_CHAT_MAX_OUTPUT_TOKENS:-500}
    - AiChat__HistoryTurns=${AI_CHAT_HISTORY_TURNS:-4}
    - ConnectionStrings__DefaultConnection=Server=db;Database=greenshop;Uid=greenshop_app;Pwd=${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD
      in .env};
    - Metrics__TokenFile=/run/secrets/metrics_token
    volumes:
    - data_protection_keys:/app/keys
    - product_images:/app/wwwroot/uploads/products
    ports: ['127.0.0.1:5000:8080']
    networks: [app_net, database_net, monitoring_net]
    healthcheck: {test: [CMD, dotnet, GreenShop.Web.dll, --healthcheck], interval: 10s, timeout: 5s, retries: 12, start_period: 30s}
    secrets: [metrics_token]
    user: 1654:1654
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1.0
    logging: {driver: syslog, options: {syslog-address: 'udp://127.0.0.1:1514', syslog-format: rfc5424micro, tag: greenshop-web,
        mode: non-blocking, max-buffer-size: 4m, cache-max-size: 10m, cache-max-file: '3'}}
    image: greenshop-web:main

  nginx:
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: nginx_server
    restart: always
    depends_on: {web_app: {condition: service_healthy}, promtail: {condition: service_healthy}}
    ports: ['80:80', '443:443']
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    networks: [app_net, monitoring_net]
    healthcheck: {test: [CMD-SHELL, 'wget -q -O /dev/null --no-check-certificate https://127.0.0.1/health/ready'], interval: 10s,
      timeout: 5s, retries: 6, start_period: 15s}
    logging: {driver: syslog, options: {syslog-address: 'udp://127.0.0.1:1514', syslog-format: rfc5424micro, tag: nginx, mode: non-blocking,
        max-buffer-size: 4m, cache-max-size: 10m, cache-max-file: '3'}}

  prometheus:
    restart: unless-stopped
    networks: [monitoring_net, admin_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=3d,
      --storage.tsdb.retention.size=512MB]
    volumes:
    - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus
    secrets: [metrics_token]
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    mem_limit: 384m
    cpus: 0.5
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready'], interval: 10s, timeout: 3s, retries: 12}

  grafana:
    restart: unless-stopped
    networks: [monitoring_net, admin_net, logging_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_COOKIE_SECURE: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:3000/}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_UNIFIED_ALERTING_MIN_INTERVAL: 10s
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_ALERTING_ENABLED: 'false'
      ALERT_WEBHOOK_URL: http://alert-receiver:8080/alerts
    secrets: [grafana_password]
    volumes:
    - grafana_data:/var/lib/grafana
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:${GRAFANA_PORT:-3000}:3000']
    mem_limit: 512m
    cpus: 1.0
    healthcheck: {test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health'], interval: 10s, timeout: 3s, retries: 18}
    memswap_limit: 768m
    depends_on: {prometheus: {condition: service_healthy}, loki: {condition: service_healthy}, alert-receiver: {condition: service_healthy}}

  mysql-exporter:
    restart: unless-stopped
    networks: [database_net, monitoring_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: sha256:abed8dac117b4ae5b70757f988e44795935b9a72c3b58d720c67ba688f8cb79e
    command: [--config.my-cnf=/run/secrets/mysql_exporter_config, '--mysqld.address=db:3306', --no-collect.slave_status, --no-collect.info_schema.innodb_cmp,
      --no-collect.info_schema.innodb_cmpmem]
    secrets: [mysql_exporter_config]
    mem_limit: 64m
    cpus: 0.15

  nginx-exporter:
    restart: unless-stopped
    networks: [monitoring_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    command: ['--nginx.scrape-uri=http://nginx:8081/nginx_status']
    mem_limit: 48m
    cpus: 0.15

  cadvisor:
    restart: unless-stopped
    networks: [monitoring_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command: [--docker_only=true, --housekeeping_interval=10s, --store_container_labels=false, '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service',
      '--disable_metrics=disk,diskIO,percpu,referenced_memory,resctrl,sched,tcp,udp,hugetlb']
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    mem_limit: 256m
    cpus: 0.5

  loki:
    restart: unless-stopped
    networks: [logging_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: greenshop-loki:main
    build: {context: ./monitoring/loki}
    user: 10001:10001
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
    - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
    - loki_data:/loki
    mem_limit: 256m
    cpus: 0.4

  promtail:
    restart: unless-stopped
    networks: [logging_net, admin_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: grafana/promtail:3.6.11@sha256:a761cb834cfaeee29745440d4884d6748f0a08d8f68928db1d707018c1dcfbe9
    user: 10001:10001
    command: [-config.file=/etc/promtail/promtail.yml]
    volumes:
    - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    - promtail_positions:/positions
    mem_limit: 96m
    cpus: 0.2
    depends_on: {loki: {condition: service_healthy}}
    healthcheck: {test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/9080; printf "GET /ready HTTP/1.0\r\nHost: localhost\r\n\r\n"
          >&3; head -n 1 <&3 | grep -q "200 OK"'], interval: 10s, timeout: 3s, retries: 12, start_period: 15s}
    ports: ['127.0.0.1:1514:1514/udp']

  alert-receiver:
    restart: unless-stopped
    networks: [monitoring_net]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    image: sha256:9c51ecce261773a684c8345b2d4673700055c513b4d54bc0719337d3e4ee552e
    user: 65534:65534
    command: [python, /receiver.py]
    volumes:
    - ./monitoring/alerts/receiver.py:/receiver.py:ro
    tmpfs: ['/tmp:size=16m,mode=1777']
    read_only: true
    mem_limit: 32m
    cpus: 0.2
    container_name: greenshop-alert-receiver
    healthcheck: {test: [CMD, python, -c, 'import socket; s=socket.create_connection(("127.0.0.1",8080),2); s.sendall(b"GET
          /health HTTP/1.0\r\nHost: localhost\r\n\r\n"); assert b" 200 " in s.recv(64); s.close()'], interval: 10s, timeout: 5s,
      retries: 6, start_period: 15s}

# Existing persistent data; Compose must not create replacement volumes.
volumes:
  mysql_data: {name: dtc245200016_btl_tkqt_htpm_mysql_data, external: true}
  data_protection_keys: {name: dtc245200016_btl_tkqt_htpm_data_protection_keys, external: true}
  product_images: {name: dtc245200016_btl_tkqt_htpm_product_images, external: true}
  prometheus_data: {name: dtc245200016_btl_tkqt_htpm_prometheus_data, external: true}
  grafana_data: {name: dtc245200016_btl_tkqt_htpm_grafana_data, external: true}
  loki_data: {name: dtc245200016_btl_tkqt_htpm_loki_data, external: true}
  promtail_positions: {name: dtc245200016_btl_tkqt_htpm_promtail_positions, external: true}

# Existing Main networks; service names provide internal DNS aliases.
networks:
  app_net: {name: dtc245200016_btl_tkqt_htpm_app_net, external: true}
  monitoring_net: {name: dtc245200016_btl_tkqt_htpm_monitoring_net, external: true}
  admin_net: {name: dtc245200016_btl_tkqt_htpm_admin_net, external: true}
  logging_net: {name: dtc245200016_btl_tkqt_htpm_logging_net, external: true}
  database_net: {name: dtc245200016_btl_tkqt_htpm_database_net, external: true}
  db_admin_net: {name: dtc245200016_btl_tkqt_htpm_db_admin_net, external: true}

# Private files from .env configuration; mount read-only into their consumers.
secrets:
  metrics_token: {file: '${MONITORING_SECRETS_DIR:?Set a private absolute MONITORING_SECRETS_DIR}/metrics-token'}
  grafana_password: {file: '${MONITORING_SECRETS_DIR:?Set a private absolute MONITORING_SECRETS_DIR}/grafana-password'}
  mysql_exporter_config: {file: '${MONITORING_SECRETS_DIR:?Set a private absolute MONITORING_SECRETS_DIR}/mysql-exporter.cnf'}
