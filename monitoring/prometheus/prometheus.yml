global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s
  external_labels:
    project: greenshop
scrape_configs:
- job_name: greenshop
  authorization:
    type: Bearer
    credentials_file: /run/secrets/metrics_token
  static_configs:
  - targets:
    - web_app:8080
- job_name: prometheus
  static_configs:
  - targets:
    - prometheus:9090
- job_name: mysql
  static_configs:
  - targets:
    - mysql-exporter:9104
- job_name: nginx
  static_configs:
  - targets:
    - nginx-exporter:9113
- job_name: cadvisor
  static_configs:
  - targets:
    - cadvisor:8080
