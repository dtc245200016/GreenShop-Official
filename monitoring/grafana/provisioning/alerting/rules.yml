apiVersion: 1
groups:
- orgId: 1
  name: GreenShop 10s
  folder: GreenShop Alerts
  interval: 10s
  rules:
  - uid: gs-sec-001
    title: GreenShopSuspiciousLoginFailures
    condition: C
    for: 0s
    noDataState: NoData
    execErrState: Error
    labels:
      project: greenshop
      category: security
      severity: warning
      incident: GS-SEC-001
    annotations:
      summary: GreenShopSuspiciousLoginFailures
      description: At least 5 rejected credential checks in a rolling 60s window.
        Suspected password guessing; no claim of compromise.
      runbook_url: /d/greenshop-security
      __dashboardUid__: greenshop-security
      __panelId__: '3'
      investigation: Grafana Explore → GreenShop Loki. Select environment main; correlate
        UTC, request_id and trace_id. Query auth.login.failed for GS-SEC-001; inspect
        target/HTTP metrics for availability alerts.
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: greenshop-prometheus
      model:
        refId: A
        expr: sum(greenshop_auth_login_failures_last_60s) >= bool 5
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
deleteRules:
- orgId: 1
  uid: gs-web-down
- orgId: 1
  uid: gs-mysql-down
- orgId: 1
  uid: gs-http-5xx
